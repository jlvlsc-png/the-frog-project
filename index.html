<!DOCTYPE html>
<html lang="en" class="scroll-smooth snap-y snap-mandatory">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Frog Project</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            frog: {
              DEFAULT: '#B4F02A',
              dark: '#8EBE1F',
              light: '#C9F458'
            },
            bg: '#0F1319',
            card: '#161B22'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif']
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/dist/index.css" />

  <style>
    html, body { width: 100%; height: 100%; }

    /* Background animated grid + floating blobs */
    @keyframes floaty {
      0%, 100% { transform: translate3d(0,0,0) scale(1); }
      50% { transform: translate3d(0,-18px,0) scale(1.05); }
    }

    @keyframes gridShift {
      0% { transform: translateY(0); opacity: .35; }
      50% { transform: translateY(12px); opacity: .55; }
      100% { transform: translateY(0); opacity: .35; }
    }

    @keyframes sweep {
      0% { transform: translateX(-120%); opacity: .0; }
      15% { opacity: .75; }
      100% { transform: translateX(120%); opacity: .0; }
    }

    @keyframes frogPop {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.08); }
    }

    .frog-emoji { animation: frogPop 1.1s ease-in-out infinite; }
    .bg-float-1 { animation: floaty 6.5s ease-in-out infinite; }
    .bg-float-2 { animation: floaty 8.5s ease-in-out infinite; }
    .bg-grid { animation: gridShift 5.5s ease-in-out infinite; }

    .bg-sweep {
      background: linear-gradient(90deg, rgba(180,240,42,0) 0%, rgba(180,240,42,.7) 45%, rgba(180,240,42,0) 100%);
      animation: sweep 1.6s ease-in-out infinite;
    }

    /* Keep it centered and obvious */
    .glass {
      background: rgba(6,8,10,0.55);
      border: 1px solid rgba(180,240,42,0.25);
      backdrop-filter: blur(16px);
    }
    html.dark .glass {
      background: rgba(15,19,25,0.65);
      border: 1px solid rgba(180,240,42,0.3);
    }

    /* Minimal motion preference */
    @media (prefers-reduced-motion: reduce) {
      .frog-emoji, .bg-float-1, .bg-float-2, .bg-grid, .bg-sweep { animation: none !important; }
    }
  </style>
</head>

<body class="w-full h-full overflow-hidden bg-white text-slate-900 transition-colors duration-500 dark:bg-[#0F1319] dark:text-white">
  <!-- Animated background -->
    <div class="absolute inset-0 overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-b from-frog/10 via-transparent to-transparent"></div>

    <!-- Ensure background animations always move (even under stacking contexts) -->
    <div class="bg-grid absolute inset-0 opacity-60" style="background-image: linear-gradient(to right, rgba(180,240,42,0.12) 1px, transparent 1px), linear-gradient(to bottom, rgba(180,240,42,0.12) 1px, transparent 1px); background-size: 44px 44px;"></div>


    <!-- Floating blobs -->
    <div class="bg-float-1 absolute -top-24 -left-24 w-72 h-72 bg-frog/20 blur-[70px] rounded-full"></div>
    <div class="bg-float-2 absolute -bottom-28 -right-28 w-72 h-72 bg-blue-500/10 blur-[70px] rounded-full"></div>

    <!-- Sweep line -->
    <div class="bg-sweep absolute left-0 top-0 w-full h-12" style="transform: translateX(-120%);"></div>

    <!-- Subtle vignette -->
    <div class="absolute inset-0" style="background: radial-gradient(circle at 50% 20%, rgba(180,240,42,0.14), rgba(0,0,0,0.0) 55%, rgba(0,0,0,0.35) 100%);"></div>
  </div>

  <!-- Center message -->
  <main class="relative w-full min-h-screen flex items-center justify-center px-4 py-8">
    <section class="glass w-full max-w-2xl rounded-[2rem] px-6 py-8 sm:px-10 sm:py-10 text-center shadow-2xl flex items-center justify-center">
      <div class="flex items-center justify-center gap-4">
        <span class="frog-emoji text-5xl sm:text-6xl" aria-hidden="true">🐸</span>
        <div class="w-full">
          <div class="inline-flex items-center gap-3 rounded-full px-4 py-2 bg-white/5 border border-frog/30">
            <i class="ph-bold ph-spinner-solid animate-spin text-frog"></i>
            <span class="font-bold text-sm tracking-[0.25em] uppercase">Updating</span>
          </div>
        </div>
      </div>

      <h1 class="mt-6 font-display text-3xl sm:text-4xl font-extrabold tracking-tight">
        THE FROG PROJECT
      </h1>

      <p class="mt-4 text-frog font-bold text-lg sm:text-xl">
        Be right back :)
      </p>

      <!-- Looping loader dots -->
      <div class="mt-7 flex items-center justify-center">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-frog animate-[bounceDot_1s_ease-in-out_infinite]" style="animation-delay: 0s"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-frog animate-[bounceDot_1s_ease-in-out_infinite]" style="animation-delay: 0.15s"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-frog animate-[bounceDot_1s_ease-in-out_infinite]" style="animation-delay: 0.3s"></span>
        </div>
      </div>

      <style>
        @keyframes bounceDot {
          0%, 100% { transform: translateY(0); opacity: .65; }
          50% { transform: translateY(-6px); opacity: 1; }
        }
      </style>
    </section>
  </main>

  <script>
    (function () {
      try {
        var html = document.documentElement;
        var saved = localStorage.getItem('theme');
        if (saved) html.classList.toggle('dark', saved === 'dark');
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          html.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
