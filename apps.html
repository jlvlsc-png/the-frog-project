    <script>
        // ── Particle Background ──────────────────────────────────────────
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        const mouse = { x: null, y: null, radius: 150 };
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.radius = Math.random() * 2;
            }
            update() {
                let dx = mouse.x - this.x, dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < mouse.radius) {
                    const force = (mouse.radius - distance) / mouse.radius;
                    this.x -= dx * force * 0.6;
                    this.y -= dy * force * 0.6;
                }
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#B4F02A';
                ctx.fill();
            }
        }
        for (let i = 0; i < 60; i++) particles.push(new Particle());
        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            ctx.strokeStyle = 'rgba(180, 240, 42, 0.1)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // ── Tool Data ────────────────────────────────────────────────────
        const tools = [

                const downloadUrl = 'https://github.com/jlvlsc-png/Site-frog/releases/download/v1.0/Site.Frog_1.0.0_x64-setup.exe';
                const a = document.createElement('a');
                a.href = downloadUrl; a.rel = 'noopener noreferrer';
                a.download = 'Site.Frog_1.0.0_x64-setup.exe';
                a.style.display = 'none';
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => { try { window.location.href = downloadUrl; } catch(_) {} }, 1500);
            };

            modalOverlay.classList.add('active');

            if (tool.name === 'SPACE FROG' || tool.name === 'SITE FROG') {
                window.__frogTcDownloadGatePending = true;
            }
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
        }
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        // ── T&C Gate ─────────────────────────────────────────────────────
        function openFrogTcModalOnly({ onAgree, onDecline } = {}) {
            const overlay = document.getElementById('modalOverlay');
            if (overlay) overlay.classList.add('active');
            const modalBox = overlay ? overlay.querySelector('.modal-box') : null;
            if (modalBox) modalBox.classList.remove('overflow-hidden');

            if (localStorage.getItem('frogTcAccepted') === 'true') {
                if (typeof onAgree === 'function') onAgree();
                return;
            }

            const mc = document.getElementById('modalContent');
            mc.innerHTML = `
                <div class="relative z-10">
                    <div class="flex items-start justify-between gap-4 mb-4">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-frog/20 flex items-center justify-center text-frog text-3xl">
                                <i class="ph-bold ph-book-open"></i>
                            </div>
                            <div>
                                <h3 class="text-2xl font-display font-bold text-white uppercase glow-text">Terms & Conditions</h3>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-col gap-4">
                        <div id="tcScrollBox" class="h-[50vh] overflow-y-auto pr-2 hide-scrollbar rounded-[1.25rem] border border-white/10 bg-white/5">
                            <pre class="whitespace-pre-wrap text-[12px] leading-relaxed text-gray-300 p-6">${window.__frogTcText || ''}</pre>
                        </div>
                        <div class="mt-1 flex flex-col sm:flex-row gap-3 items-stretch">
                            <button id="tcDeclineBtn" onclick="if (typeof window.__frogTcDeclined === 'function') window.__frogTcDeclined(); closeModal();" class="flex-1 py-4 bg-card/20 border border-white/10 text-white font-bold rounded-xl hover:bg-white/10 transition-transform">
                                Decline
                            </button>
                            <button id="tcAgreeBtn" disabled onclick="window.__frogTcAgreed && window.__frogTcAgreed();" class="flex-1 py-4 relative overflow-hidden bg-frog/10 text-white font-bold rounded-xl transition-transform disabled:opacity-100 disabled:cursor-not-allowed">
                                <span class="relative z-10 flex items-center justify-center gap-2">Agree</span>
                                <span id="tcAgreeFill" class="absolute left-0 top-0 h-full w-0 bg-frog transition-[width] duration-150 ease-linear"></span>
                                <span class="absolute left-0 top-0 h-full w-full opacity-30 bg-frog/10 pointer-events-none"></span>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            const scrollBox = document.getElementById('tcScrollBox');
            const agreeBtn  = document.getElementById('tcAgreeBtn');
            const tcAgreeFill = document.getElementById('tcAgreeFill');

            window.__frogTcAgreed = () => {
                try { localStorage.setItem('frogTcAccepted', 'true'); if (typeof onAgree === 'function') onAgree(); }
                finally { closeModal(); }
            };
            window.__frogTcDeclined = () => { try { if (typeof onDecline === 'function') onDecline(); } finally {} };

            const markCompleted = () => {
                if (!agreeBtn || agreeBtn.disabled === false) return;
                agreeBtn.disabled = false;
                if (tcAgreeFill) tcAgreeFill.style.width = '100%';
                agreeBtn.classList.remove('bg-frog/10');
                agreeBtn.classList.add('bg-frog', 'text-white');
            };

            const checkBottom = () => {
                if (!scrollBox) return;
                const tolerance = 16;
                const scrollable = Math.max(1, scrollBox.scrollHeight - scrollBox.clientHeight);
                const progress = Math.min(1, Math.max(0, scrollBox.scrollTop / scrollable));
                if (tcAgreeFill) tcAgreeFill.style.width = `${Math.round(progress * 100)}%`;
                if (scrollBox.scrollTop + scrollBox.clientHeight >= scrollBox.scrollHeight - tolerance) markCompleted();
            };

            scrollBox.addEventListener('scroll', checkBottom, { passive: true });
            setTimeout(checkBottom, 50);
            document.getElementById('modalOverlay')?.classList.add('active');
        }

        // ── Download Gate ────────────────────────────────────────────────
        window.__frogTcStartDownload = window.__frogTcStartDownload || function(appName) {
            if (appName !== 'SPACE FROG' && appName !== 'SITE FROG') return;

            if (localStorage.getItem('frogTcAccepted') === 'true') {
                if (appName === 'SITE FROG') {
                    window.__frogSiteFrogDownloadExe ? window.__frogSiteFrogDownloadExe() : (window.location.href = 'https://github.com/jlvlsc-png/Site-frog/releases/download/v1.0/Site.Frog_1.0.0_x64-setup.exe');
                } else {
                    window.__frogSpaceFrogDownloadExe ? window.__frogSpaceFrogDownloadExe() : (window.location.href = 'https://github.com/jlvlsc/Space-Frog/releases/download/v1.0.0/SpaceFrog-Setup-1.0.0.exe');
                }
                closeModal(); return;
            }

            if (typeof openFrogTcModalOnly === 'function') {
                openFrogTcModalOnly({
                    onAgree: () => {
                        if (appName === 'SITE FROG') {
                            window.__frogSiteFrogDownloadExe ? window.__frogSiteFrogDownloadExe() : (window.location.href = 'https://github.com/jlvlsc-png/Site-frog/releases/download/v1.0/Site.Frog_1.0.0_x64-setup.exe');
                        } else {
                            window.__frogSpaceFrogDownloadExe ? window.__frogSpaceFrogDownloadExe() : (window.location.href = 'https://github.com/jlvlsc/Space-Frog/releases/download/v1.0.0/SpaceFrog-Setup-1.0.0.exe');
                        }
                    },
                    onDecline: () => {}
                });
            }
        };

        // ── Theme ────────────────────────────────────────────────────────
        // Theme handled by html class

        function toggleTheme(event) {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            const newTheme = isDark ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            const nextBgColor = newTheme === 'dark' ? '#0F1319' : '#f8fafc';
            const ripple = document.createElement('div');
            ripple.style.cssText = `position:fixed;border-radius:50%;background-color:${nextBgColor};z-index:9999;pointer-events:none;`;
            const rect = event.currentTarget.getBoundingClientRect();
            const x = rect.left + rect.width / 2, y = rect.top + rect.height / 2;
            const radius = Math.sqrt(Math.max(x, innerWidth - x) ** 2 + Math.max(y, innerHeight - y) ** 2);
            ripple.style.width = ripple.style.height = `${radius * 2}px`;
            ripple.style.left = `${x - radius}px`; ripple.style.top = `${y - radius}px`;
            ripple.style.transform = 'scale(0)';
            ripple.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
            document.body.appendChild(ripple);
            requestAnimationFrame(() => { ripple.style.transform = 'scale(1)'; });
            setTimeout(() => {
                html.classList.toggle('dark');
                ripple.style.transition = 'opacity 0.4s ease'; ripple.style.opacity = '0';
                setTimeout(() => ripple.remove(), 400);
            }, 600);
        }

        // ── Scroll Reveal ────────────────────────────────────────────────
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { root: null, rootMargin: '0px', threshold: 0.1 });
        document.querySelectorAll('.reveal-up, .reveal-scale').forEach(el => observer.observe(el));

        // ── Navbar scroll effect ─────────────────────────────────────────
        const navbar = document.getElementById('navbar');
        const navContainer = document.getElementById('navContainer');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('shadow-md', 'dark:shadow-black/50');
                navContainer.classList.replace('py-4', 'py-3');
            } else {
                navbar.classList.remove('shadow-md', 'dark:shadow-black/50');
                navContainer.classList.replace('py-3', 'py-4');
            }
        });

        // ── Security ─────────────────────────────────────────────────────
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                (e.ctrlKey && e.key === 'U') || (e.ctrlKey && e.key === 'S')
            ) { e.preventDefault(); return false; }
        });
        if (typeof console !== 'undefined') {
            console.log('%cSTOP!', 'color: red; font-size: 50px; font-weight: bold; -webkit-text-stroke: 1px black;');
            console.log('%cThis is a browser feature intended for developers. If someone told you to copy-paste something here, it is a scam.', 'font-size: 18px;');
        }
    </script>
</body>
