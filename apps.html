    <script>
        tailwind.config = {
            darkMode: 'class',

                    colors: {
                        frog: {

                    },
                    keyframes: {

                            '0%, 100%': { transform: 'translateY(0)' },

                        },
                        fall: {

    <style>
        html, body { width: 100%; max-width: 100%; overflow-x: hidden; }

        @keyframes neonPulse {
            0% { filter: drop-shadow(0 0 6px rgba(180,240,42,0.20)); opacity: 0.85; }
            50% { filter: drop-shadow(0 0 14px rgba(180,240,42,0.45)); opacity: 1; }
            100% { filter: drop-shadow(0 0 6px rgba(180,240,42,0.20)); opacity: 0.85; }
        }

        /* Modal UI Styles */
        #modalOverlay { display: flex; visibility: hidden; opacity: 0; transition: all 0.3s ease; padding: 0; }
        #modalOverlay.active { visibility: visible; opacity: 1; }
        .modal-box { transform: scale(0.9) translateY(20px); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); border-radius: 2.5rem; overflow: hidden; }
        #modalOverlay.active .modal-box { transform: scale(1) translateY(0); }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes frogBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-10px) scale(1.05); }
            50% { transform: translateY(0) scale(1); }
            75% { transform: translateY(-5px) scale(1.02); }
        }
        .animate-frog-bounce { animation: frogBounce 2s ease-in-out infinite; }

        @keyframes neonGridPulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.4; }
        }
        .neon-grid {
            background-image: linear-gradient(to right, rgba(180,240,42,0.1) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(180,240,42,0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: neonGridPulse 4s ease-in-out infinite alternate;
        }

        @keyframes scanlines {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }
        .neon-sweep {
            background: repeating-linear-gradient(to bottom, transparent, transparent 1px, rgba(180,240,42,0.05) 1px, rgba(180,240,42,0.05) 2px);
            background-size: 100% 100px;
            animation: scanlines 10s linear infinite;
        }

        .neon-pulse { animation: neonPulse 0.8s ease-in-out infinite; will-change: opacity, box-shadow; }

        @keyframes siteFrogProgressPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.00), 0 0 0 rgba(255, 255, 255, 0.00);
                border-color: rgba(255, 255, 255, 0.12);
                background: rgba(255, 255, 255, 0.02);
            }
            50% {
                box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.10), 0 0 28px rgba(255, 255, 255, 0.18);
                border-color: rgba(255, 255, 255, 0.30);
                background: rgba(255, 255, 255, 0.06);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.00), 0 0 0 rgba(255, 255, 255, 0.00);
                border-color: rgba(255, 255, 255, 0.12);
                background: rgba(255, 255, 255, 0.02);
            }
        }
        .site-frog-progress {
            animation: siteFrogProgressPulse 1.4s ease-in-out infinite;
            will-change: box-shadow, border-color, background;
        }

        .glow-text { text-shadow: 0 0 15px rgba(180,240,42,0.4); }

        @media (prefers-reduced-motion: reduce) {
            .neon-pulse { animation: none !important; }
        }

        .reveal-up, .reveal-scale { opacity: 0; transform: translateY(26px); transition: opacity 700ms cubic-bezier(0.16,1,0.3,1), transform 700ms cubic-bezier(0.16,1,0.3,1); will-change: opacity, transform; }
        .reveal-scale { transform: translateY(26px) scale(0.98); }
        .reveal-up.visible { opacity: 1; transform: translateY(0); }
        .reveal-scale.visible { opacity: 1; transform: translateY(0) scale(1); }

        .neon-title { position: relative; }
        .neon-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -10px;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, rgba(180,240,42,0) 0%, rgba(180,240,42,0.7) 20%, rgba(180,240,42,0.7) 80%, rgba(180,240,42,0) 100%);
            box-shadow: 0 0 18px rgba(180,240,42,0.35);
        }

        @keyframes modalBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -60px) scale(1.2); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }
        .animate-modal-blob { animation: modalBlob 12s infinite alternate ease-in-out; }

        @keyframes navGlow {
            0%, 100% { border-bottom-color: rgba(180, 240, 42, 0.1); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
            50% { border-bottom-color: rgba(180, 240, 42, 0.4); box-shadow: 0 4px 30px rgba(180, 240, 42, 0.1); }
        }
        .nav-animate { animation: navGlow 4s ease-in-out infinite; }

        @keyframes textShimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .shimmer-text { background: linear-gradient(90deg, currentColor 0%, #B4F02A 50%, currentColor 100%); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: textShimmer 6s linear infinite; }

        @keyframes sweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }

        * { user-select: none; -webkit-user-select: none; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #B4F02A; border-radius: 10px; }

        .tool-card-active {
            border-color: #B4F02A !important;
            background: rgba(180, 240, 42, 0.1) !important;
            transform: translateX(10px);
        }

        @keyframes borderPulse {
            0% { box-shadow: 0 0 0 0 rgba(180, 240, 42, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(180, 240, 42, 0); }
            100% { box-shadow: 0 0 0 0 rgba(180, 240, 42, 0); }
        }

        /* Page fade-in */
        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .page-enter { animation: pageFadeIn 0.6s cubic-bezier(0.16,1,0.3,1) forwards; }

        /* Back button hover */
        .back-btn:hover .back-arrow { transform: translateX(-4px); }
        .back-arrow { transition: transform 0.2s ease; }
    </style>
</head>

        <div class="w-10 h-10 rounded-full bg-frog/20 dark:bg-frog/10 flex items-center justify-center text-frog-dark dark:text-frog">

    <script>
        // ── Particle Background ──────────────────────────────────────────
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        const mouse = { x: null, y: null, radius: 150 };
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.radius = Math.random() * 2;
            }
            update() {
                let dx = mouse.x - this.x, dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < mouse.radius) {
                    const force = (mouse.radius - distance) / mouse.radius;
                    this.x -= dx * force * 0.6;
                    this.y -= dy * force * 0.6;
                }
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#B4F02A';
                ctx.fill();
            }
        }
        for (let i = 0; i < 60; i++) particles.push(new Particle());
        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            ctx.strokeStyle = 'rgba(180, 240, 42, 0.1)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // ── Tool Data ────────────────────────────────────────────────────
        const tools = [
            { name: "BUILDSYNC",    icon: "ph-package",             desc: "Construction submittal & package automation.",           status: "Under Construction", color: "slate-400" },
            { name: "SPACE FROG",   icon: "ph-bounding-box",        desc: "Smart space programming & adjacency logic.",             status: "Available now",      color: "frog" },
            { name: "SITE FROG",    icon: "ph-map-trifold",         desc: "Smart Site analysis & automated earthworks data.",       status: "Available now",      color: "frog" },
            { name: "3D FROG",      icon: "ph-cube",                desc: "Lightweight 2D/3D modeling bridging tools.",             status: "Under Construction", color: "slate-400" },
            { name: "SPEC FROG",    icon: "ph-article",             desc: "Automated material specifications and computation.",     status: "Under Construction", color: "slate-400" },
            { name: "FROG REVIEW",  icon: "ph-book-open",           desc: "Smart Board Exam mastery for future staff.",             status: "Under Construction", color: "slate-400" },
            { name: "FROG ADMIN",   icon: "ph-identification-card", desc: "Student & Project management toolset.",                 status: "Under Construction", color: "slate-400" },
            { name: "FROG CLOUD",   icon: "ph-cloud-arrow-up",      desc: "Centralized ecosystem data hosting.",                   status: "Under Construction", color: "slate-400" }
        ];

        // ── Day counters ─────────────────────────────────────────────────
        const SITE_FROG_DAY1_LOCAL = new Date('2026-06-10T00:00:00');
        const SPEC_FROG_DAY1_LOCAL = new Date('2026-07-16T00:00:00');

        function getSiteFrogDayNumber() {
            const now = new Date();
            const msPerDay = 1000 * 60 * 60 * 24;
            const nowMidnight  = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const startMidnight = new Date(SITE_FROG_DAY1_LOCAL.getFullYear(), SITE_FROG_DAY1_LOCAL.getMonth(), SITE_FROG_DAY1_LOCAL.getDate());
            return Math.max(1, Math.floor((nowMidnight - startMidnight) / msPerDay) + 1);
        }

        function getSpecFrogDayNumber() {
            const now = new Date();
            const msPerDay = 1000 * 60 * 60 * 24;
            const nowMidnight  = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const startMidnight = new Date(SPEC_FROG_DAY1_LOCAL.getFullYear(), SPEC_FROG_DAY1_LOCAL.getMonth(), SPEC_FROG_DAY1_LOCAL.getDate());
            const days = Math.floor((nowMidnight - startMidnight) / msPerDay) + 1;
            return days < 1 ? 'Dev Starts July 16' : 'Day ' + days;
        }

        function updateSiteFrogDayCounters() {
            const siteEl = document.querySelector('.site-frog-day-counter[data-app="SITE FROG"]');
            if (siteEl) siteEl.textContent = String(getSiteFrogDayNumber());
            const specEl = document.querySelector('.site-frog-day-counter[data-app="SPEC FROG"]');
            if (specEl) specEl.textContent = String(getSpecFrogDayNumber());
        }

        // ── Build Tool Grid ──────────────────────────────────────────────
        const toolGrid = document.getElementById('toolGrid');
        tools.forEach((tool, index) => {
            const isSpecFrog   = tool.name === 'SPEC FROG';
            const isAppWithCounter = isSpecFrog;
            const isSpaceFrog  = tool.name === 'SPACE FROG';
            const isSiteFrog   = tool.name === 'SITE FROG';
            const isActiveTool = isSpaceFrog || isSiteFrog;
            const isDisabled   = !isActiveTool;

            const div = document.createElement('div');
            div.className = `relative p-3 sm:p-5 rounded-3xl border transition-all duration-300 flex flex-col items-center justify-center text-center gap-2 group reveal-up ${
                isDisabled
                    ? 'opacity-50 cursor-not-allowed grayscale pointer-events-none border-slate-200/60 dark:border-white/10 bg-white dark:bg-card'
                    : 'cursor-pointer border-slate-200/70 dark:border-white/10 bg-white dark:bg-card hover:border-frog/60 hover:bg-frog/10'
            } ${
                isActiveTool ? 'tool-card-active animate-[neonPulse_3s_ease-in-out_infinite]' :
                isAppWithCounter ? 'border-white/10 site-frog-progress' : ''
            }`;

            div.innerHTML = `
                ${isAppWithCounter ? `<div class="absolute top-0 left-0 -translate-x-0.5 -translate-y-0.5 px-2 py-0.5 rounded-br-xl rounded-tl-xl bg-white/10 border border-white/20 text-white/90 backdrop-blur text-[9px] font-bold tracking-widest" style="box-shadow: 0 0 18px rgba(255,255,255,0.12);" data-app="${tool.name}"><span class="site-frog-day-counter" data-app="${tool.name}">${getSpecFrogDayNumber()}</span></div>` : ''}
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl border ${
                    isActiveTool ? 'border-frog/30 bg-frog/10' : 'border-white/10 bg-white/5'
                } flex items-center justify-center">
                    <i class="ph-bold ${tool.icon} text-xl sm:text-2xl ${
                        isActiveTool ? 'text-frog' : 'text-slate-400'
                    } transition-transform group-hover:scale-110"></i>
                </div>

            localStorage.setItem('theme', newTheme);
            const nextBgColor = newTheme === 'dark' ? '#0F1319' : '#f8fafc';
            const ripple = document.createElement('div');
            ripple.style.cssText = `position:fixed;border-radius:50%;background-color:${nextBgColor};z-index:9999;pointer-events:none;`;
            const rect = event.currentTarget.getBoundingClientRect();
            const x = rect.left + rect.width / 2, y = rect.top + rect.height / 2;
            const radius = Math.sqrt(Math.max(x, innerWidth - x) ** 2 + Math.max(y, innerHeight - y) ** 2);
            ripple.style.width = ripple.style.height = `${radius * 2}px`;
            ripple.style.left = `${x - radius}px`; ripple.style.top = `${y - radius}px`;
